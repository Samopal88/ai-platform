<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Platform Docs</title>
    <style>
        :root { color-scheme: light; --bg:#f7f7f4; --panel:#fff; --text:#1f2328; --muted:#667085; --border:#deded8; --accent:#111827; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
        .layout { min-height:100vh; display:grid; grid-template-columns:280px 1fr; }
        aside { border-right:1px solid var(--border); background:var(--panel); padding:18px; position:sticky; top:0; height:100vh; overflow:auto; }
        main { padding:34px min(7vw, 72px); max-width:980px; }
        h1 { margin:0 0 18px; font-size:30px; }
        h2 { margin-top:34px; font-size:22px; }
        h3 { margin-top:24px; font-size:17px; }
        p, li { line-height:1.65; }
        a { color:#0b6f58; }
        .brand { font-weight:800; font-size:18px; margin-bottom:16px; }
        .nav { display:grid; gap:4px; }
        .nav button { border:0; background:transparent; color:var(--text); text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; font:inherit; }
        .nav button:hover, .nav button.active { background:#f0f0ed; color:#111827; }
        .toplink { display:inline-flex; margin-bottom:22px; color:var(--muted); text-decoration:none; }
        .doc { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:28px; }
        code { background:#f0f1ee; padding:2px 5px; border-radius:5px; }
        table { border-collapse: collapse; width:100%; margin:18px 0; }
        th, td { border:1px solid var(--border); padding:9px 10px; text-align:left; }
        th { background:#f3f5f1; }
        @media (max-width: 820px) {
            .layout { grid-template-columns:1fr; }
            aside { position:relative; height:auto; }
            main { padding:20px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside>
            <div class="brand">AI Platform Docs</div>
            <nav class="nav" id="nav"></nav>
        </aside>
        <main>
            <a class="toplink" href="/chat">← Вернуться в чат</a>
            <article class="doc" id="doc">Загрузка...</article>
        </main>
    </div>
    <script>
        const pages = [
            ['README', 'Обзор'],
            ['getting-started', 'Начало работы'],
            ['plans-and-tokens', 'Тарифы и токены'],
            ['subscription', 'Подписка'],
            ['models', 'Модели'],
            ['chat', 'Чат'],
            ['projects-and-files', 'Проекты и файлы'],
            ['file-editing', 'AI-редактирование'],
            ['image-generation', 'Картинки'],
            ['speech-to-text', 'Речь в текст'],
            ['prompts', 'Промпты'],
            ['security', 'Безопасность'],
            ['release-readiness', 'Статус готовности'],
            ['faq', 'FAQ'],
        ];
        const nav = document.getElementById('nav');
        const doc = document.getElementById('doc');

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }

        function markdownToHtml(md) {
            let html = escapeHtml(md);
            html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            const lines = html.split('\n');
            const out = [];
            let inList = false;
            for (const line of lines) {
                if (line.startsWith('- ')) {
                    if (!inList) { out.push('<ul>'); inList = true; }
                    out.push(`<li>${line.slice(2)}</li>`);
                } else {
                    if (inList) { out.push('</ul>'); inList = false; }
                    if (line.trim() && !line.startsWith('<h') && !line.startsWith('|')) out.push(`<p>${line}</p>`);
                    else if (line.trim()) out.push(line);
                }
            }
            if (inList) out.push('</ul>');
            return out.join('\n');
        }

        async function loadPage(slug) {
            nav.querySelectorAll('button').forEach(btn => btn.classList.toggle('active', btn.dataset.slug === slug));
            const path = slug === 'README' ? '/docs-public' : `/docs-public/${slug}`;
            const res = await fetch(path);
            const text = await res.text();
            doc.innerHTML = markdownToHtml(text);
            history.replaceState(null, '', `?page=${encodeURIComponent(slug)}`);
        }

        nav.innerHTML = pages.map(([slug, label]) => `<button type="button" data-slug="${slug}">${label}</button>`).join('');
        nav.addEventListener('click', event => {
            const btn = event.target.closest('button[data-slug]');
            if (btn) loadPage(btn.dataset.slug);
        });
        const start = new URLSearchParams(location.search).get('page') || 'README';
        loadPage(pages.some(([slug]) => slug === start) ? start : 'README');
    </script>
</body>
</html>
